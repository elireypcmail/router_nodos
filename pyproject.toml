[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multishop-nodo-api"
version = "0.0.0"
description = "Agente FastAPI Multishop en tienda (MySQL ERP + VPN hub)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.6.0",
    "pymysql>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "db*",
    "routes*",
    "middleware*",
]

[tool.setuptools]
py-modules = ["main", "categories_models"]
