# Tres tiendas de prueba (MySQL 5.6 + API nodo) en la red del hub dev.
#
# Requisito: hub levantado (red externa multishop_hub_dev):
#   cd <repo-root>
#   docker compose -f docker-compose.dev.yml up -d
#
# Preparar envs (tras provisioning en hub-ui, pegar NODO_ID y NODO_API_TOKEN):
#   cp scripts/test/envs/tienda-1.env.example scripts/test/envs/tienda-1.env
#   cp scripts/test/envs/tienda-2.env.example scripts/test/envs/tienda-2.env
#   cp scripts/test/envs/tienda-3.env.example scripts/test/envs/tienda-3.env
#
# Levantar nodos:
#   cd Multishop-nodo-API
#   docker compose -f scripts/test/docker-compose.nodos.yml up -d --build
#
# Cargar backup en las 3 tiendas (repo: backup_seguro.sql.gz o .enc + BACKUP_DECRYPT_PASS):
#   ./scripts/test/docker/import-backup-to-tiendas.sh
#
# Ver README-docker-nodos.md para hosts de provisioning en hub-ui (modo Internet).

name: multishop-test-nodos

x-mysql-tienda: &mysql-tienda
  image: mysql:5.6.51
  platform: linux/amd64
  restart: unless-stopped
  environment: &mysql-env
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: mi_base_historica
    MYSQL_USER: multishop
    MYSQL_PASSWORD: multishop
    # Opcional: importar .enc en primer init (mismo valor que en el host).
    BACKUP_DECRYPT_PASS: ${BACKUP_DECRYPT_PASS:-}
  command:
    - --character-set-server=latin1
    - --collation-server=latin1_swedish_ci
    - --sql_mode=NO_ENGINE_SUBSTITUTION
    - --max_allowed_packet=64M
  healthcheck:
    test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 40s

x-nodo-api: &nodo-api
  build:
    context: ../..
    dockerfile: scripts/test/docker/Dockerfile
  restart: unless-stopped
  networks:
    - multishop_hub_dev
  # No fijar NODO_ID / NODO_API_TOKEN / HUB_* aquí: sobrescriben envs/tienda-N.env.
  environment: &nodo-api-env
    NODO_HOST: 0.0.0.0
    NODO_PORT: 8443
    NODO_ALLOW_INSECURE: 'true'
    NODO_DEV_RELOAD: 'false'
    SYNC_DB_PATH: /app/data/sync.sqlite
    HUEY_DB_PATH: /app/data/huey.sqlite
    NODO_APPLY_OUTBOX_TRIGGERS: 'true'
    NODO_REFRESH_DOTENV: 'true'

services:
  mysql-tienda-1:
    <<: *mysql-tienda
    container_name: multishop-mysql-tienda-1
    environment:
      <<: *mysql-env
    volumes:
      - mysql_tienda_1_data:/var/lib/mysql
      - ../..:/host-repo:ro
      - ./docker/mysql-init/02-import-backup.sh:/docker-entrypoint-initdb.d/02-import-backup.sh:ro
    ports:
      - '127.0.0.1:13306:3306'
    networks:
      - tienda-1-internal

  nodo-tienda-1:
    <<: *nodo-api
    container_name: multishop-nodo-tienda-1
    hostname: nodo-tienda-1
    env_file:
      - ./envs/tienda-1.env
    environment:
      <<: *nodo-api-env
      MYSQL_HOST: mysql-tienda-1
    depends_on:
      mysql-tienda-1:
        condition: service_healthy
    ports:
      - '127.0.0.1:18443:8443'
    volumes:
      - nodo_tienda_1_data:/app/data
    networks:
      - tienda-1-internal
      - multishop_hub_dev

  mysql-tienda-2:
    <<: *mysql-tienda
    container_name: multishop-mysql-tienda-2
    environment:
      <<: *mysql-env
    volumes:
      - mysql_tienda_2_data:/var/lib/mysql
      - ../..:/host-repo:ro
      - ./docker/mysql-init/02-import-backup.sh:/docker-entrypoint-initdb.d/02-import-backup.sh:ro
    ports:
      - '127.0.0.1:13307:3306'
    networks:
      - tienda-2-internal

  nodo-tienda-2:
    <<: *nodo-api
    container_name: multishop-nodo-tienda-2
    hostname: nodo-tienda-2
    env_file:
      - ./envs/tienda-2.env
    environment:
      <<: *nodo-api-env
      MYSQL_HOST: mysql-tienda-2
    depends_on:
      mysql-tienda-2:
        condition: service_healthy
    ports:
      - '127.0.0.1:18444:8443'
    volumes:
      - nodo_tienda_2_data:/app/data
    networks:
      - tienda-2-internal
      - multishop_hub_dev

  mysql-tienda-3:
    <<: *mysql-tienda
    container_name: multishop-mysql-tienda-3
    environment:
      <<: *mysql-env
    volumes:
      - mysql_tienda_3_data:/var/lib/mysql
      - ../..:/host-repo:ro
      - ./docker/mysql-init/02-import-backup.sh:/docker-entrypoint-initdb.d/02-import-backup.sh:ro
    ports:
      - '127.0.0.1:13308:3306'
    networks:
      - tienda-3-internal

  nodo-tienda-3:
    <<: *nodo-api
    container_name: multishop-nodo-tienda-3
    hostname: nodo-tienda-3
    env_file:
      - ./envs/tienda-3.env
    environment:
      <<: *nodo-api-env
      MYSQL_HOST: mysql-tienda-3
    depends_on:
      mysql-tienda-3:
        condition: service_healthy
    ports:
      - '127.0.0.1:18445:8443'
    volumes:
      - nodo_tienda_3_data:/app/data
    networks:
      - tienda-3-internal
      - multishop_hub_dev

networks:
  multishop_hub_dev:
    external: true
    name: multishop_hub_dev
  tienda-1-internal:
    name: multishop_tienda_1_internal
  tienda-2-internal:
    name: multishop_tienda_2_internal
  tienda-3-internal:
    name: multishop_tienda_3_internal

volumes:
  mysql_tienda_1_data:
    name: multishop_test_mysql_tienda_1
  mysql_tienda_2_data:
    name: multishop_test_mysql_tienda_2
  mysql_tienda_3_data:
    name: multishop_test_mysql_tienda_3
  nodo_tienda_1_data:
    name: multishop_test_nodo_tienda_1_data
  nodo_tienda_2_data:
    name: multishop_test_nodo_tienda_2_data
  nodo_tienda_3_data:
    name: multishop_test_nodo_tienda_3_data
